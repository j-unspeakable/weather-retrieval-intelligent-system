<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Weather Intelligence{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
    {% block head %}{% endblock %}
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <p class="eyebrow">National Weather Service · Raw ingestion</p>
        <h1>Weather Intelligence</h1>
        <p>Collect forecasts, alerts, and observations across individual points or entire states.</p>
      </div>
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
  </body>
</html>
