[project]
name = "weather-intelligence-mcp"
version = "0.1.0"
description = "Global Open-Meteo and Day 2 Lakebase retrieval tools for Databricks"
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk>=0.30.0",
    "fastmcp>=3.2.0,<4.0.0",
    "pydantic>=2.10.0",
    "requests>=2.32.3",
    "urllib3>=2.2.0",
]

[project.scripts]
weather-mcp = "weather_mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["weather_broker", "weather_mcp_server"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
